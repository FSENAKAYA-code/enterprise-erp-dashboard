[project]
name = "enterprise-erp-dashboard"
version = "0.1.0"
description = "Business intelligence metrics and SQL-ready analytics patterns"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "pandas>=2.2", "plotly>=5.18", "scikit-learn>=1.4", "sqlalchemy>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
